name: wisekoin-dev

services:
  neon-local:
    image: ${NEON_LOCAL_IMAGE:-neondatabase/neon_local:latest}
    restart: unless-stopped
    ports:
      - "${NEON_LOCAL_PORT:-5432}:5432"
    environment:
      NEON_API_KEY: ${NEON_API_KEY:?Set NEON_API_KEY in .env.development}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:?Set NEON_PROJECT_ID in .env.development}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID:?Set PARENT_BRANCH_ID in .env.development}
      DELETE_BRANCH: ${DELETE_BRANCH:-true}

  database-ready:
    image: postgres:17-alpine
    depends_on:
      - neon-local
    environment:
      NEON_DATABASE: ${NEON_DATABASE:-neondb}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until pg_isready -h neon-local -p 5432 -U neon -d "$${NEON_DATABASE}";
        do sleep 2; done
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database-ready:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://neon-local:5432/${NEON_DATABASE:-neondb}?sslmode=disable
      DB_USERNAME: neon
      DB_PASSWORD: npg
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-wisekoin-backend@local}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.development}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-2592000000}
      VISION_LANGUAGE_API_KEY: ${VISION_LANGUAGE_API_KEY:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-native}
      RECURRING_TRANSACTIONS_CRON: "${RECURRING_TRANSACTIONS_CRON:-0 5 0 * * *}"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AI_REQUESTS: ${RATE_LIMIT_AI_REQUESTS:-10}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-20}
      RATE_LIMIT_API_REQUESTS: ${RATE_LIMIT_API_REQUESTS:-120}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env.development}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env.development}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env.development}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL:?Set OTP_FROM_EMAIL in .env.development}
      OTP_EXPIRATION_SECONDS: ${OTP_EXPIRATION_SECONDS:-600}
      OTP_VERIFICATION_EXPIRATION_SECONDS: ${OTP_VERIFICATION_EXPIRATION_SECONDS:-600}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_SENDS_PER_HOUR: ${OTP_MAX_SENDS_PER_HOUR:-3}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
    security_opt:
      - no-new-privileges:true
