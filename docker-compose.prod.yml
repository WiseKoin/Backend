name: wisekoin-prod

services:
  app:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE in .env.production}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_URL: ${DB_URL:?Set the Neon JDBC URL in .env.production}
      DB_USERNAME: ${DB_USERNAME:?Set the Neon database user in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set the Neon database password in .env.production}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-2592000000}
      VISION_LANGUAGE_API_KEY: ${VISION_LANGUAGE_API_KEY:-}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-native}
      RECURRING_TRANSACTIONS_CRON: "${RECURRING_TRANSACTIONS_CRON:-0 5 0 * * *}"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AI_REQUESTS: ${RATE_LIMIT_AI_REQUESTS:-10}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-20}
      RATE_LIMIT_API_REQUESTS: ${RATE_LIMIT_API_REQUESTS:-120}
    security_opt:
      - no-new-privileges:true
