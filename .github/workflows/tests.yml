name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wisekoin_test
          POSTGRES_USER: wisekoin
          POSTGRES_PASSWORD: wisekoin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wisekoin -d wisekoin_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/wisekoin_test
      DB_USERNAME: wisekoin
      DB_PASSWORD: wisekoin
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      VISION_LANGUAGE_API_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Add test results to job summary
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/TEST-*.xml)

          total=0
          failures=0
          errors=0
          skipped=0

          if (( ${#reports[@]} > 0 )); then
            total=$(grep -h '<testsuite ' "${reports[@]}" | sed -n 's/.* tests="\([0-9]*\)".*/\1/p' | awk '{ sum += $1 } END { print sum + 0 }')
            failures=$(grep -h '<testsuite ' "${reports[@]}" | sed -n 's/.* failures="\([0-9]*\)".*/\1/p' | awk '{ sum += $1 } END { print sum + 0 }')
            errors=$(grep -h '<testsuite ' "${reports[@]}" | sed -n 's/.* errors="\([0-9]*\)".*/\1/p' | awk '{ sum += $1 } END { print sum + 0 }')
            skipped=$(grep -h '<testsuite ' "${reports[@]}" | sed -n 's/.* skipped="\([0-9]*\)".*/\1/p' | awk '{ sum += $1 } END { print sum + 0 }')
          fi

          passed=$((total - failures - errors - skipped))
          test_icon="❌"
          [[ "$TEST_OUTCOME" == "success" ]] && test_icon="✅"

          {
            echo "## Test summary"
            echo
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Maven tests | $test_icon $TEST_OUTCOME |"
            echo
            echo "| Tests | Passed | Failed | Errors | Skipped |"
            echo "| ---: | ---: | ---: | ---: | ---: |"
            echo "| $total | $passed | $failures | $errors | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce CI results
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [[ "$TEST_OUTCOME" != "success" ]]; then
            exit 1
          fi
