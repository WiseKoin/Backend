name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wisekoin_test
          POSTGRES_USER: wisekoin
          POSTGRES_PASSWORD: wisekoin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wisekoin -d wisekoin_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/wisekoin_test
      DB_USERNAME: wisekoin
      DB_PASSWORD: wisekoin
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      VISION_LANGUAGE_API_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
