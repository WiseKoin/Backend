name: Lint and format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check linting and formatting
        id: spotless
        continue-on-error: true
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

      - name: Add formatting result to job summary
        if: always()
        shell: bash
        env:
          SPOTLESS_OUTCOME: ${{ steps.spotless.outcome }}
        run: |
          icon="❌"
          [[ "$SPOTLESS_OUTCOME" == "success" ]] && icon="✅"

          {
            echo "## Lint and format summary"
            echo
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Spotless | $icon $SPOTLESS_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce formatting result
        if: always()
        shell: bash
        env:
          SPOTLESS_OUTCOME: ${{ steps.spotless.outcome }}
        run: |
          if [[ "$SPOTLESS_OUTCOME" != "success" ]]; then
            exit 1
          fi
