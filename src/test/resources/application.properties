spring.datasource.url=jdbc:h2:mem:wisekoin-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
jwt.secret=test-only-secret-that-is-at-least-thirty-two-bytes-long
jwt.expiration=900000
jwt.refresh-expiration=2592000000
gemini.api.vision.language.key=test-key
gemini.api.vision.language.url=https://example.test/gemini
gemini.api.vision.language.model=test-model
app.rate-limit.enabled=false
spring.mail.host=
app.otp.from=

sentry.data-collection.user-info=false
sentry.data-collection.cookies.mode=off
sentry.data-collection.http-headers.request.mode=off
sentry.data-collection.http-headers.response.mode=off
sentry.data-collection.http-bodies=
sentry.data-collection.url-query-params.mode=off
sentry.data-collection.graphql.document=false
sentry.data-collection.graphql.variables=false
sentry.data-collection.file-paths=false
