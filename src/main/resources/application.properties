spring.application.name=wisekoin

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:7}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Scan receipt task
gemini.api.vision.language.key=${VISION_LANGUAGE_API_KEY}
gemini.api.vision.language.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent}
gemini.api.vision.language.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.api.vision.language.fallback-url=${GEMINI_FALLBACK_URL:}
gemini.api.vision.language.fallback-model=${GEMINI_FALLBACK_MODEL:}

# Adaptive AI extraction context and application-derived confidence.
# Keep calibrated=false until the profile has passed a representative evaluation corpus.
app.ai.default-locale=${AI_DEFAULT_LOCALE:vi-VN}
app.ai.prompts.receipt.resource=${AI_RECEIPT_PROMPT_RESOURCE:classpath:ai/prompts/receipt-v2.txt}
app.ai.prompts.receipt.version=${AI_RECEIPT_PROMPT_VERSION:receipt-v2}
app.ai.prompts.voice.resource=${AI_VOICE_PROMPT_RESOURCE:classpath:ai/prompts/voice-v2.txt}
app.ai.prompts.voice.version=${AI_VOICE_PROMPT_VERSION:voice-v2}
app.ai.confidence.profile=${AI_CONFIDENCE_PROFILE:baseline-v1}
app.ai.confidence.calibrated=${AI_CONFIDENCE_CALIBRATED:false}
app.ai.confidence.high-threshold=${AI_CONFIDENCE_HIGH_THRESHOLD:0.80}
app.ai.confidence.medium-threshold=${AI_CONFIDENCE_MEDIUM_THRESHOLD:0.55}

# Limits for sizes of files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Application clock and recurring expense scheduler
app.time-zone=${APP_TIME_ZONE:UTC}
app.recurring-transactions.cron=${RECURRING_TRANSACTIONS_CRON:0 5 0 * * *}

# Per-user (authenticated) or per-IP (anonymous) fixed-window rate limits
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.ai.requests=${RATE_LIMIT_AI_REQUESTS:10}
app.rate-limit.auth.requests=${RATE_LIMIT_AUTH_REQUESTS:20}
app.rate-limit.api.requests=${RATE_LIMIT_API_REQUESTS:120}

# SMTP delivery for security verification codes. No OTP value is logged.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
app.otp.from=${OTP_FROM_EMAIL:${MAIL_USERNAME:}}
app.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:600}
app.otp.verification-expiration-seconds=${OTP_VERIFICATION_EXPIRATION_SECONDS:600}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-sends-per-hour=${OTP_MAX_SENDS_PER_HOUR:3}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
