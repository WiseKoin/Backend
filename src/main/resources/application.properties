spring.application.name=wisekoin

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Scan receipt task
gemini.api.vision.language.key=${VISION_LANGUAGE_API_KEY}
gemini.api.vision.language.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent

# Limits for sizes of files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
